spark.master                                local[*]
spark.driver.memory                         6g
spark.sql.shuffle.partitions                16

spark.serializer                            org.apache.spark.serializer.KryoSerializer
spark.kryo.registrator                      org.apache.sedona.core.serde.SedonaKryoRegistrator
spark.sql.extensions                        org.apache.sedona.sql.SedonaSqlExtensions,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# A single catalog backed by the Hive Metastore, holding both the external bronze tables and the
# Iceberg tables of silver and gold
spark.sql.catalogImplementation             hive
spark.hadoop.hive.metastore.uris            thrift://metastore:9083
spark.sql.catalog.spark_catalog             org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type        hive

# RustFS standing in for S3
spark.hadoop.fs.s3a.endpoint                http://rustfs:9000
spark.hadoop.fs.s3a.endpoint.region         us-east-1
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
