# Warnings and errors only, so the output of the jobs is not buried in Spark's INFO logs
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Hadoop falls back to its Java implementations, which is fine here
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error

# Sedona replaces the few ST_ functions that Spark 4.1 ships with its own on startup
logger.functions.name = org.apache.spark.sql.catalyst.analysis.SimpleFunctionRegistry
logger.functions.level = error

# Sedona reads GeoParquet with parquet-mr instead of the vectorized reader, which is expected
logger.geoparquet.name = org.apache.spark.sql.execution.datasources.geoparquet.GeoParquetFileFormat
logger.geoparquet.level = error

# Long query plans are truncated when printed, which only affects how they show in the logs
logger.planstring.name = org.apache.spark.util.SparkStringUtils
logger.planstring.level = error
